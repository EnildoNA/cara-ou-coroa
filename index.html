<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip the Coin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flip the Coin</h1>
        <h2>Press the coin or the button to flip the coin</h2>
    </header>
    <main id="main">
        <section>
            <img src="assets/heads.svg" alt="Head side of the coin">
            <img src="assets/shadow.svg" alt="Shadow of the coin">
        </section>
        <p>Heads</p>
        <button id="flip">Random</button>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
